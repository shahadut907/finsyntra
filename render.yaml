# Free-tier trial: Render Free web service + Neon Postgres + Cloudflare embeddings + Groq.
services:
  - type: web
    name: finsyntra-demo-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements-render.txt
    startCommand: sh deploy/render/start.sh
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - { key: PYTHON_VERSION, value: 3.11.9 }
      - { key: ENV, value: production }
      - { key: DEBUG, value: "false" }
      - { key: BYPASS_AUTH, value: "false" }
      - { key: PUBLIC_DEMO_ENABLED, value: "true" }
      - { key: EMBEDDINGS_PROVIDER, value: cloudflare }
      - { key: LLM_PROVIDER, value: groq }
      - { key: GROQ_MODEL, value: openai/gpt-oss-20b }
      - { key: VECTOR_DB_PATH, value: /tmp/finsolve/chroma }
      - { key: RAW_DOCUMENTS_PATH, value: /tmp/finsolve/raw }
      - { key: DEMO_DOCUMENTS_PATH, value: src/data/demo_corpus }
      - { key: WEB_CONCURRENCY, value: "1" }
      # Secrets: set in the Render dashboard, never in this file.
      - { key: SECRET_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: CLOUDFLARE_ACCOUNT_ID, sync: false }
      - { key: CLOUDFLARE_API_TOKEN, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
