# FinSyntra — Alembic configuration
#
#   alembic upgrade head          apply migrations
#   alembic current               show the applied revision
#   alembic history --verbose     show the chain
#
# The database URL is NOT set here. alembic/env.py resolves it from the
# application settings (DATABASE_URL -> src.config.settings), so migrations and
# the running app can never disagree about which database they are pointed at.
# Override for a one-off run with:
#   alembic -x db_url=sqlite:///./tmp/scratch.db upgrade head

[alembic]
script_location = alembic

# Only this directory is scanned. alembic/legacy_unrunnable/ is deliberately
# excluded — see the README there.
version_locations = alembic/versions

# Keep generated filenames sortable and readable.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
