# Native production Nginx config for FinSyntra.
# Single public origin: https://finsolve.example.com (replace placeholder).
# Serves the marketing landing page at / and the FinSyntra application build
# at /app (both static, both under /opt/finsolve/frontend-build), and
# reverse-proxies API/auth to the loopback-only FastAPI process. FastAPI's
# port is never exposed publicly.
#
# Install:
#   sudo cp deploy/production/nginx.conf /etc/nginx/sites-available/finsolve
#   sudo ln -s /etc/nginx/sites-available/finsolve /etc/nginx/sites-enabled/finsolve
#   sudo nginx -t && sudo systemctl reload nginx
#
# Validated only by structural review on this Windows host — `nginx -t` was
# NOT run here because Nginx is not installed on this machine. Run `nginx -t`
# for real on the Linux deployment host before relying on this file.

server {
    listen 80;
    server_name finsolve.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name finsolve.example.com;

    # Provide real certificate paths (e.g. from certbot) on the deployment host.
    ssl_certificate     /etc/letsencrypt/live/finsolve.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finsolve.example.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # style-src/font-src additions are for the landing page's Google Fonts
    # link (Sora/Inter/JetBrains Mono/Noto Sans Bengali) — everything else
    # (script-src, connect-src) stays locked to 'self'.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'" always;

    root /opt/finsolve/frontend-build;
    index index.html;

    # FinSyntra application build (CRA, built with homepage=/app) lives at
    # /opt/finsolve/frontend-build/app — its own SPA fallback, separate from
    # the marketing landing page's fallback below.
    location ^~ /app {
        try_files $uri $uri/ /app/index.html;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Real readiness probe (DB + RAG/vector-store checked live). Exposed
    # read-only for monitoring/deploy smoke tests — Nginx does not perform
    # any upstream-removal or traffic-gating logic based on its result.
    location = /health/ready {
        proxy_pass http://127.0.0.1:8000/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE chat stream: disable buffering, allow a long read timeout so the
    # connection survives generation latency instead of being cut by Nginx.
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Nginx's default 1m would reject uploads with an HTML 413 before the
        # backend's own 10 MB-per-file check runs. The admin batch endpoint
        # (/api/admin/upload-department-data) takes several files per request.
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing page SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
